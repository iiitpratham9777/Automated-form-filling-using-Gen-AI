[project]
name="formpilot-backend"
version="1.0.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.9,<3","pydantic-settings>=2.5,<3","python-multipart>=0.0.12,<1","python-jose[cryptography]>=3.3,<4","passlib[bcrypt]>=1.7,<2","sqlalchemy>=2,<3","aiosqlite>=0.20,<1","playwright>=1.48,<2","pymupdf>=1.24,<2","pillow>=10,<12","pytesseract>=0.3.13,<1","langgraph>=0.2,<1","langchain-core>=0.3,<1","httpx>=0.27,<1","pytest>=8,<9","pytest-asyncio>=0.24,<1"]
[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
include=["app*"]
[tool.pytest.ini_options]
asyncio_mode="auto"
